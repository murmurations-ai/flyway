<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>flyway — live demo</title>
<meta name="description" content="An animated end-to-end run of the flyway protocol: two independent AI-agent murmurations initialize, recognize each other, and exchange a cryptographically signed tension." />
<link rel="stylesheet" href="./brand.css" />
<style>
  body { background:var(--hero-sky); min-height:100vh; }
  .stage { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px 18px; gap:var(--s-lg); position:relative; }
  #bg-flock { position:fixed; inset:0; width:100%; height:100%; z-index:0; opacity:.5; }
  .stage > * { position:relative; z-index:1; }
  .title { text-align:center; }
  .title h1 { font-family:"Archivo",sans-serif; font-stretch:125%; font-weight:800; font-size:clamp(2.2rem,6vw,3.4rem); letter-spacing:-.02em; color:var(--ink); }
  .title h1 small { font-family:"Plex Mono",monospace; font-size:.28em; font-weight:400; font-stretch:normal; color:var(--gold-ink); letter-spacing:.14em; text-transform:uppercase; vertical-align:middle; margin-left:10px; }
  .title p { color:var(--ink-muted); margin:8px 0 0; font-size:.95rem; }
  .term { width:min(880px,100%); }
  .screen { height:clamp(360px,58vh,560px); overflow:hidden; padding:18px 20px; background:var(--term-bg); }
  .screen pre { margin:0; font-family:"Plex Mono",monospace; font-size:.8rem; line-height:1.66; white-space:pre-wrap; word-break:break-word; color:var(--term-ink); }
  .ln { opacity:0; } .ln.show { opacity:1; }
  .cur { display:inline-block; width:8px; height:15px; background:var(--gold); vertical-align:-2px; animation:blink 1s steps(2) infinite; margin-left:2px; }
  @keyframes blink { 50% { opacity:0; } }
  @media (prefers-reduced-motion: reduce){ .cur { animation:none; } }
  .controls { display:flex; gap:var(--s-sm); }
  .foot { color:var(--ink-faint); font-size:.78rem; font-family:"Plex Mono",monospace; text-align:center; }
</style>
</head>
<body>
<button class="theme-toggle" data-theme-toggle aria-label="Toggle light or dark theme">◐ theme</button>
<canvas id="bg-flock" data-flock aria-hidden="true"></canvas>

<div class="stage">
  <div class="title">
    <h1 class="display">flyway <small>live demo</small></h1>
    <p>Two independent murmurations · recognize · sign a tension across the boundary</p>
  </div>
  <div class="term">
    <div class="term-bar"><i></i><i></i><i></i><span>flyway — end-to-end, verbatim from the built CLI</span></div>
    <div class="screen"><pre id="out"></pre></div>
  </div>
  <div class="controls">
    <button class="btn primary" id="replay">↻ replay</button>
    <a class="btn" href="./presentation.html">the season deck</a>
    <a class="btn" href="https://github.com/murmurations-ai/flyway">view the repo ↗</a>
  </div>
  <div class="foot">reproduce: git clone → <span style="color:var(--ink-muted)">pnpm i &amp;&amp; pnpm -r build</span> → run the smoke</div>
</div>

<script src="./brand.js"></script>
<script>
  var L = [
    ['<span class="c-m"># 1 · two independent murmurations initialize</span>', 340],
    ['<span class="c-a">[A]</span> Initialized flyway identity: <span class="c-hl">did:web:github.com:xeeban:a</span>', 120],
    ['<span class="c-b">[B]</span> Initialized flyway identity: <span class="c-hl">did:web:github.com:emergent:praxis</span>', 620],
    ['', 60],
    ['<span class="c-m"># 2 · mutual recognition — each verifies the other</span>', 320],
    ['<span class="c-a">[A]</span> Recognized did:web:github.com:emergent:praxis', 120],
    ['<span class="c-a">[A]</span>   fingerprint:  vVP7tUsbgFEF5fVB_PmkUxPVtWRq9hkl…', 120],
    ['<span class="c-b">[B]</span> Recognized did:web:github.com:xeeban:a', 120],
    ['<span class="c-b">[B]</span>   fingerprint:  8HwJS8SrFNIp1c4qFMycAuko-1qiie82…', 640],
    ['', 60],
    ['<span class="c-m"># 3 · A signs a tension → delivered into B\'s inbox</span>', 320],
    ['<span class="c-a">[A]</span> Flagged tension to did:web:github.com:emergent:praxis', 120],
    ['<span class="c-a">[A]</span>   id:       1784161602463-80d46002', 120],
    ['<span class="c-a">[A]</span>   delivered → …/tmp.B/flyway/inbox/github.com/xeeban/a/…yaml', 640],
    ['', 60],
    ['<span class="c-m"># 4 · B runs status — the inbox line surfaces the signal (Issue #17)</span>', 320],
    ['<span class="c-b">[B]</span> Identity: did:web:github.com:emergent:praxis  <span class="c-ok">(signature valid)</span>', 120],
    ['<span class="c-b">[B]</span> Peers:    1 recognized', 120],
    ['<span class="c-b">[B]</span>   - Nori (did:web:github.com:xeeban:a) — <span class="c-ok">sig valid</span>', 120],
    ['<span class="c-b">[B]</span> Agreements: 0 on file', 120],
    ['<span class="c-b">[B]</span> <span class="c-hl">Inbox:    1 signal (1 verified)</span>', 640],
    ['', 60],
    ['<span class="c-m"># 5 · B checks the inbox — signature verifies independently</span>', 320],
    ['<span class="c-b">[B]</span> Inbox: 1 signal (1 verified)', 120],
    ['<span class="c-b">[B]</span>   - tension  1784161602463-80d46002  from …:xeeban:a  <span class="c-ok">[sig valid]</span>', 500],
    ['', 200],
    ['<span class="c-ok">✓ round-trip complete — no shared database, no central controller.</span>', 0]
  ];
  var out = document.getElementById('out');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var timers = [];
  function play() {
    timers.forEach(clearTimeout); timers = [];
    out.innerHTML = '';
    var nodes = L.map(function (row) {
      var d = document.createElement('div'); d.className = 'ln'; d.innerHTML = row[0] || '&nbsp;';
      out.appendChild(d); return d;
    });
    if (reduce) { nodes.forEach(function (n) { n.classList.add('show'); }); return; }
    var t = 200;
    L.forEach(function (row, i) {
      timers.push(setTimeout(function () {
        nodes[i].classList.add('show');
        out.parentElement.scrollTop = out.parentElement.scrollHeight;
      }, t));
      t += (row[1] || 100) + 90;
    });
  }
  document.getElementById('replay').addEventListener('click', play);
  play();
</script>
</body>
</html>
